name: Android CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.6.0
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit generated Gradle wrapper
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if [ -n "$(git status --porcelain -- gradlew gradlew.bat gradle/wrapper)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "chore: add Gradle wrapper"
            git push
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaRemote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
