name: ReVanced CastContext Spike

on:
  workflow_dispatch:
  push:
    branches:
      - spike/revanced-cast-context
    paths:
      - 'tools/revanced-cast-spike/**'
      - '.github/workflows/revanced-cast-spike.yml'

permissions:
  contents: read

jobs:
  build-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YT Music Remote
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned patch source
        run: |
          git clone https://github.com/anddea/revanced-patches.git upstream
          cd upstream
          git checkout 6e8c20a33fe54e67500c4fd959227d33b2fc4ef3

      - name: Apply CastContext spike
        run: |
          cd upstream
          python3 ../tools/revanced-cast-spike/apply_cast_context_patch.py
          git diff --check
          git diff -- patches/src/main/kotlin/app/morphe/patches/shared/gms/GmsCoreSupportPatch.kt

      - name: Build Android patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd upstream
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: revanced-cast-context-spike
          path: upstream/patches/build/libs/*
          if-no-files-found: error
